<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 296" width="830" height="296" role="img" aria-labelledby="statsTitle">
<title id="statsTitle">GitHub statistics for codekcv: 13 total stars, 76 public repositories, 15 followers, 1644 contributions in the last twelve months. Most used languages: TypeScript 54.0 percent, JavaScript 24.8 percent, HTML 10.6 percent, CSS 8.2 percent, Lua 1.7 percent, Shell 0.4 percent. Generated 2026-09-11.</title>
<defs>
  
  <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="62"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E8EEF7" stop-opacity="0"/>
    <stop offset=".5" stop-color="#E8EEF7" stop-opacity=".085"/>
    <stop offset="1" stop-color="#E8EEF7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.35" fill="#FFFFFF" opacity="0.085"/>
  </pattern>
  <linearGradient id="sbg" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#0D111A"/>
    <stop offset="1" stop-color="#0A0C12"/>
  </linearGradient>
  <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset=".5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <clipPath id="sframe"><rect width="830" height="296" rx="16"/></clipPath>
  <!-- Base width is the full bar, not 0: a renderer that ignores SMIL then shows a
       complete bar instead of an empty track. begin="0s" means the animated value
       takes over immediately, so the full width never flashes first. -->
  <clipPath id="barClip">
    <rect x="452" y="118" width="338" height="15" rx="7.5">
      <animate attributeName="width" values="0;338" dur="1.2s" begin="0s"
        fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/>
    </rect>
  </clipPath>
  <style>
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: 'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif; }
    /* No base opacity:0 here. The keyframes plus fill-mode "both" hide the element
       while it waits its turn, but the resting state stays visible, so the card
       still reads if the animation never runs: reduced motion, a static
       rasteriser, or a re-raster that restarts the one-shot mid-scroll. */
    .rise { animation: rise .55s cubic-bezier(.22,1,.36,1) both; }
    .r0 { animation-delay: 0.10s; }
    .r1 { animation-delay: 0.17s; }
    .r2 { animation-delay: 0.24s; }
    .r3 { animation-delay: 0.31s; }
    .r4 { animation-delay: 0.60s; }
    .r5 { animation-delay: 0.66s; }
    .r6 { animation-delay: 0.72s; }
    .r7 { animation-delay: 0.78s; }
    .r8 { animation-delay: 0.84s; }
    .r9 { animation-delay: 0.90s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none; }
    }
  </style>
</defs>

